{tag:"OPENING",en:"Goal today: <b>fill all 18 rows. Every row gets an owner, a date, a number.</b><ul class=\"pts\"><li>Do not discuss money today. Decisions only.</li><li>20 minutes. Then the pen is yours.</li></ul><div class=\"ask\"><b>Your action now:</b> agree to decide today.</div>"},
{tag:"PHILOSOPHY",en:"We are a <b>studio, not a school</b>.<ul class=\"pts\"><li>Happy kids first. Freedom first. Thinking beats technique.</li><li>Proof: longer stay, more learning. Finished pieces only. A dozen techniques.</li><li>Philosophy: Danny owns it. Parent-facing words: written to match.</li></ul><div class=\"ask\"><b>Danny, your action:</b> nod once if this is correct.</div>"},
{tag:"ORDER",en:"Seven jobs. The draft order is already in the sheet.<ul class=\"pts\"><li>Trackers. Follow-up. CCA finale. Winter camp. Halloween. Videos. Certificates.</li></ul><div class=\"ask\"><b>Your action:</b> write 1, 2, 3 next to the top three.</div>"},
{tag:"TRACKERS",en:"Lock the columns today. Fill numbers after.<ul class=\"pts\"><li><b>Ledger</b>: name, school, course, taken, left, renewal, alert.</li><li><b>Leads</b>: source, child, need, next, owner, follow-up date.</li><li><b>Alerts</b>: absences, reason, make-up, churn. All on shared cloud.</li></ul><div class=\"ask\"><b>Your action:</b> add or cut a column now, or never.</div>"},
{tag:"TALK TRACKS",en:"Use this line with parents.<ul class=\"pts\"><li>Say: X妈妈, staying in Shanghai? Camp opens Dec 24. Last week's piece fits. Hold a spot?</li><li>Then ask three things: schedule, price, undecided?</li><li>Rule: <b>reply in 1 hour, follow up in 24 hours.</b></li></ul><div class=\"ask\"><b>Your action:</b> approve this script today.</div>"},
{tag:"HOURS",en:"Staffing requirement, stated plainly.<ul class=\"pts\"><li>Saturdays on-site, matching the class timetable.</li><li>Wednesday and Thursday nights, 2 hours each: ledgers, editing, calls.</li><li>Urgent issues get immediate response; all other time is protected. Heavier in weeks 1-8.</li></ul><div class=\"ask\"><b>Your action:</b> approve this time budget.</div>"},
{tag:"SUPPORT NEEDED",en:"Four things must arrive before day one.<ul class=\"pts\"><li>Decision lines. <b>Answers back within 24 hours.</b></li><li>Lists, contacts, official account, cloud access. Day one.</li><li>Budgets approved first. No advances, no overspend.</li><li>Nicole: one shared lead sheet, updated daily.</li></ul><div class=\"ask\"><b>Your action:</b> say which one is a problem, today.</div>"},
{tag:"CONSULTATION CORNER",en:"Build it. It is the mouth of the funnel.<ul class=\"pts\"><li>Nicole talks enrolment standing up today. No deal closes standing up.</li><li>Quiet corner for talking. Separate from the waiting lounge.</li></ul><div class=\"ask\"><b>Your action:</b> pick the corner and the budget.</div>"},
{tag:"ROOMS & PATHS",en:"Seven areas. Three routes. Set in stone.<ul class=\"pts\"><li>Teaching. Gallery. Front desk. Consultation corner. Waiting lounge. Storage. Photo corner.</li><li>Parents: enter, reception, gallery, talk, pay.</li><li>Kids: enter, class, pick-up. Filming: 5 minutes before class.</li></ul><div class=\"ask\"><b>Danny, your action:</b> approve this layout.</div>"},
{tag:"SUPPLIES FOR SALE",en:"Parents ask. We show nothing. We sell nothing. That is money leaving.<ul class=\"pts\"><li>Put supplies on the shelf.</li><li>Start with the 3 most-asked items.</li></ul><div class=\"ask\"><b>Your action:</b> name the first 3 items.</div>"},
{tag:"PERSONAS",en:"Four targets. Two rejects.<ul class=\"pts\"><li><b>A:</b> international-school parents. Base: 25 CCA + Wellington/Concordia. Proof: Josh family.</li><li><b>B:</b> current parents. Half to convert.</li><li><b>C:</b> neighbors. Birthdays and Halloween first.</li><li><b>D:</b> adults later. <b>No:</b> bargain hunters, crammers.</li></ul><div class=\"ask\"><b>Your action:</b> approve or change one line.</div>"},
{tag:"FUNNEL",en:"Five steps. Five numbers. Weekly sheet.<ul class=\"pts\"><li>Heard of us. Walked in. Signed up. Bought again. Sent friends.</li><li><b>1 hour. 60%. 50%. 24 hours. Renewal.</b></li></ul><div class=\"ask\"><b>Your action:</b> approve these 5 numbers.</div>"},

function go(i){cur=Math.max(0,Math.min(PAGES.length-1,i));save();render();window.scrollTo(0,0);}
function upd(){let n=0,d=0;PAGES.forEach((p,i)=>{if(p.tag||p.type==='sheet'){d++;if(st['r'+i])n++;}});ROWS.forEach((_,i)=>{d++;if(st['c'+i])n++;});
document.getElementById('pct').textContent=n+' / '+d+' · '+Math.round(n/d*100)+'%';document.getElementById('bar').style.width=(d?Math.round(n/d*100):0)+'%';
var _pc=d?Math.round(n/d*100):0;var _mg=_pc>=100?'All locked: take the photo!':(_pc>=50?'Over halfway: keep going':(n>0?'Nice: keep going':'Let us begin'));var _pe=document.querySelector('.progress .t span:first-child');if(_pe)_pe.textContent='✔ '+n+'/'+d+' · '+_mg;}
document.getElementById('prevBtn').onclick=()=>go(cur-1);
document.getElementById('nextBtn').onclick=()=>{if(cur>=PAGES.length-1)go(0);else go(cur+1);};
document.getElementById('tocBtn').onclick=()=>go(2);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1);});
render();
</script>
</body>
</html>
