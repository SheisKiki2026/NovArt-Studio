<script>
const PAGES=[
{type:"cover"},

{type:"toc"},
{tag:"PHILOSOPHY",en:"We are a <b>studio, not a school</b> — by belief and by law.<ul class=\"pts\"><li><b>Why, by belief:</b> typical education runs on fixed syllabuses, week by week. Fixed syllabuses, week by week, work against how children create. Kids come here to experiment.</li><li><b>Why, by law:</b> we are registered as a creative place, not an educational institution. We provide assistance and consulting in art. Our words must match that status.</li><li><b>The gap:</b> the philosophy is the founder\u2019s — but parents still ask what their child learns here. That delivery message is missing. Build it below.</li></ul>What parents get instead of a syllabus:<ul class=\"pts\"><li>Finished pieces, only. A dozen techniques over time.</li><li>Artist stories: who made this style, and why it matters (the founder\u2019s parent PPTs).</li><li>Photos, videos, showcases — growth you can see. Proof in hand: Patterns in Art — 12 weeks, 3 chapters, every chapter ends framed.</li></ul>Three items for the founder to complete:<ul class=\"pts\"><li><b>1.</b> NovArt in one sentence: ______</li><li><b>2.</b> Banned words (education, training, school, course, lesson): ______</li><li><b>3.</b> Approve or rewrite the swap list below. ______</li></ul><table><tr><th>Don\u2019t say</th><th>Say instead (proposal)</th></tr><tr><td>education / training</td><td>creative studio time</td></tr><tr><td>school</td><td>studio</td></tr><tr><td>teacher</td><td>artist / guide</td></tr><tr><td>course / syllabus</td><td>program / exploration</td></tr><tr><td>lesson</td><td>session</td></tr><tr><td>grades</td><td>showcase pieces</td></tr></table>"},
{tag:"PERSONAS",en:"Five targets. Best-fit focus.<ul class=\"pts\"><li><b>A:</b> international-school parents. Base: 10 regulars now, 15 optimal; plus 25 CCA + one Pudong school (Wellington/Concordia/Pinfold). Proof: Josh family.</li><li><b>B:</b> current parents + trials. Convert half, keep every regular.</li><li><b>C:</b> neighbors. Birthdays and Halloween first. Parents pay for the whole party — collect every contact. Packages: 6–8 kids, cost-covering, every guest to trials.</li><li><b>D:</b> adults later: ladies with free time, hobby classes.</li><li><b>E:</b> teens with a goal: portfolio, competitions, study abroad. Highest ticket. Proof: Japan/Italy awards. The founder writes the recommendation.</li><li><b>Not a fit:</b> price-only shoppers, last-minute crammers.</li></ul>"},
{tag:"GOALS",en:"Three phases. In this order.<ul class=\"pts\"><li><b>Survive:</b> collect every fee. Fill the winter camp. Prices locked (400, 3+1); trial fee decided.</li><li><b>Stabilize:</b> trackers live, follow-ups within 24 hours, retention 10 → 15. New commitments follow once this holds.</li><li><b>Grow:</b> exhibitions, one new school, the 2027 calendar. Growth builds on stability.</li><li>Fill all 36 rows. Every row gets an owner, a date, a number. One name per row — shared ownership is no ownership.</li></ul>"},
{tag:"DIAGNOSIS",en:"Read this first. A clear-eyed review.<ul class=\"pts\"><li><b>Money:</b> about \u00a58,000 in. Priority: secure the base before scaling. Uncollected fees are the first recovery (see Leads).</li><li><b>Math:</b> 10 regulars now, 15 optimal. Retention (next-year continuations to confirm) plus new recruits \u2014 stick to numbers.</li><li><b>Sales:</b> filled by the sales-lead hire (see ORDER). Every other line accelerates once it exists.</li><li><b>Execution:</b> plan complete (Gantt); execution begins as owners are assigned. The lever is ownership: every row gets a name.</li><li><b>Pipeline:</b> trials awaiting conversion, follow-ups pending. The fastest revenue is the follow-up.</li></ul>"},{tag:"ORDER",en:"Sell first. In this order.<ul class=\"pts\"><li><b>Week 1 — cash:</b> collect every CCA fee. Contact every pending family: schedule, price, open concerns. Push credits to use.</li><li><b>Week 2 — camp:</b> regulars approached step by step. 20 hours, one topic, full days. Min 4/week filled.</li><li><b>Week 3 — system:</b> trackers live, lead sheet daily, funnel numbers every Monday. Every happy parent asked to refer.</li><li><b>Then choose:</b> hire a sales lead who sets direction and runs sales (scope, start, support ready). Without a hire, scope adjusts to match hands.</li></ul>"},{tag:"DATES",en:"Months in advance, always. Every date in one place.<ul class=\"pts\"><li><b>Oct 31</b>: Halloween — 2 m pumpkin, 10 children, EKA venue.</li><li><b>Mid-Nov</b>: closing gifts + flyers printed.</li><li><b>Nov 20</b>: CC CCA finale.</li><li><b>Dec 2</b>: YCIS CCA finale.</li><li><b>Dec 24 – Jan 7</b>: winter camp, min. 4 children per week.</li><li><b>Every Monday</b>: workbook updated, funnel numbers in.</li><li><b>Every week</b>: video clips + 3-min self-review.</li><li><b>Every month</b>: parent updates (progress + feedback + preview).</li><li><b>2027</b>: winter + summer camp weeks set early (plus May + Oct weeks). Artist list published. Calendar with holidays. December showcase.</li></ul>"},
{tag:"WORKBOOK",en:"One file runs the studio. Open it every Monday.<ul class=\"pts\"><li><b>Dashboard</b>: money in, money owed, risks.</li><li><b>Students</b>: every child, classes left, renewals.</li><li><b>Leads</b>: every prospect, next step, owner.</li><li><b>Trials</b>: who came, who signed, why not.</li><li><b>WinterCamp</b>: camp seats per week.</li><li><b>Tasklist + Gantt</b>: who does what, by when.</li><li><b>Scripts</b>: exact words for parents, EN + CN.</li><li><b>Approvals</b>: discounts and cuts, in writing.</li></ul><div style=\"margin-top:12px\"><a class=\"btn-p\" style=\"display:inline-block;text-decoration:none;border-radius:10px;padding:12px 26px;font-size:14px\" href=\"https://sheiskiki2026.github.io/NovArt-Studio/NovArt-Workbook.xlsx\">Open the workbook file</a></div><div id=\"wbview\" style=\"margin-top:14px\"></div>"},
{tag:"TRACKERS",en:"Lock the columns this month. Fill numbers after.<ul class=\"pts\"><li><b>Ledger</b>: name, school, course, taken, left, renewal, alert.</li><li><b>Leads</b>: source, child, need, next, owner, follow-up date.</li><li><b>Alerts</b>: absences, reason, make-up, churn. All on shared cloud.</li><li>Credits never expire. Taken and left, visible every week.</li><li>Full classes run waitlists; churn pulls from the waitlist.</li></ul>"},
{tag:"TALK TRACKS",en:"Use these lines with parents.<ul class=\"pts\"><li>Open warm: Mama X, great to see you. Camp opens Dec 24. Last week's piece fits. I can hold a spot.</li><li>Then ask three things: schedule, price, open concerns.</li><li>Rule: <b>reply in 1 hour, follow up in 24 hours.</b></li><li>Trial invite: warm, specific, one question at a time (see Scripts T1).</li><li>If they say no: fully unpressured — art can\u2019t be rushed. Ask why: schedule, price, or timing. Write it down.</li><li><b>Service windows:</b> 9:00\u201320:00, posted on the account menu, front-desk sign, WeChat signature. The 1-hour/24-hour promises run inside windows only.</li><li><b>After hours:</b> auto-reply \u201cReceived \u2014 reply within X hours.\u201d. One phone line for true urgencies only (child safety, same-day changes).</li><li><b>Batch the rest:</b> routine messages at two fixed times daily. Urgent same day; everything else batched.</li></ul>"},
{tag:"SALES",en:"Sell in three steps. Then the system repeats.<ul class=\"pts\"><li><b>1. Talk — open chatty:</b> lovely-day style, like Mama X staying in Shanghai. Consultative and unhurried; every account settled on time. Chinese assistants bring a translator. High-rank parents go to the public email, not a personal chase.</li><li><b>Ask three things, then stop:</b> schedule, price, open concerns. Listen first. Quote only after hearing the need. Standing-up chats do not close — sit down in the consultation corner.</li><li><b>2. Follow up — within 24 hours:</b> every lead on the sheet (source, child, need, next, owner, date), updated daily. Push credits to use. Discounts explained enclosed-only: Josh-style 10%, early bird, royalty — because of this reason, shared privately.</li><li><b>3. Refer — ask outright:</b> every happy parent gets asked \u2014 at the peak: right after the finished piece or the showcase. Hand referral cards to pass on. Birthday parties: parents pay for all, collect every contact, takeaway flyer in the bag.</li><li><b>Sell camp:</b> 20 hours, one topic, full days (6 hrs, lunch included) vs 8 hours a month regular. Two-to-three days per artist block. Goats-in-art theme, museum visit inside.</li><li><b>Sell regular:</b> 400/hr tailor-made. 3+1 semester. Trial fee vs free, decided. Credits never expire. One-year story: step-by-step progress into the group show, then a solo (e.g., Patterns in Art: 12 weeks, 3 chapters, all framed).</li><li><b>Upsell at the desk:</b> framing at extra charge. Supplies parents ask for, stocked. Completed artwork every time — every piece sent home is wall-worthy.</li><li><b>Market weekly:</b> QR everywhere. Takeaway program paper parents can carry home. Posters and promo sheets ready. A lighter catalog replaces the heavy PDF.</li><li><b>Market monthly:</b> EKA events + free 2-hour tasters. Link the points system. Art-party late afternoon, exhibitions in January. One new Pudong school. 2027 calendar with holidays.</li></ul><p style=\"margin-top:12px\"><b>Every move, hands, and number.</b></p><table><tr><th>Move</th><th>Hands</th><th>KPI</th></tr><tr><td>Reply parents</td><td>on-duty phone</td><td>within 1 hr, daily</td></tr><tr><td>Follow up leads</td><td>sales owner</td><td>within 24 hrs, sheet daily</td></tr><tr><td>Push credits + renewals</td><td>sales owner</td><td>ledger 2x/week, alerts out</td></tr><tr><td>Film, edit, post</td><td>videographer</td><td>clips + 3-min reviews weekly</td></tr><tr><td>Funnel numbers</td><td>sales owner</td><td>every Monday: heard/tried/regular/repeat/refer</td></tr><tr><td>Retention calls</td><td>sales owner</td><td>10 to 15, churn logged</td></tr><tr><td>Fill camp seats</td><td>sales owner + teacher</td><td>min 4/week</td></tr><tr><td>Events + tasters</td><td>all hands</td><td>EKA monthly, art-party, Jan show</td></tr><tr><td>Ask referrals</td><td>everyone</td><td>every happy parent asked</td></tr></table><p style=\"font-size:13px;color:#8A6D2B\">Sales owner = the hire. Remaining hands to assign.</p>"},{tag:"MARKET",en:"Market notes. How others in the trade win. Transferable mechanics.<ul class=\"pts\"><li><b>Tomato Art, national:</b> since 2009, ages 2-15. Sells a thinking system, not techniques: 11 years, 5 stages. Takeaway: a ladder parents can see for a decade.</li><li><b>Smarter Art, Beijing:</b> started 2002 as one neighborhood studio, ages 2-12. Staged programs by age, franchised 2013, about 1,000 centers since. Takeaway: stage the program, then scale.</li><li><b>Abrakadoodle, US:</b> started 2002 by a teacher and an artist. Classes + camps + events, often inside schools - light rent. Takeaway: camps, events, and school channels carry the rent.</li><li><b>Loso showcase (peer model):</b> process videos on the channel, parents watch the making, showcase closes. Adopt the rhythm.</li></ul>"},{tag:"HOURS",en:"Running the studio well costs hours. Here is the full list.<ul class=\"pts\"><li><b>Daily comms:</b> parent messages answered within 1 hour. About 30–45 min a day, every day.</li><li><b>Leads, daily:</b> follow-ups within 24 hours. Lead sheet updated daily. About 3 hrs a week.</li><li><b>Ledgers, twice a week:</b> credits taken and left, renewal alerts. 2 evenings × 2 hrs.</li><li><b>Videos, weekly:</b> film, edit, post clips + 3-min self-reviews. About 3 hrs a week.</li><li><b>Saturdays on-site:</b> classes, consults, showcase prep. Full day, matching the timetable.</li><li><b>Class size:</b> six perfect, ten need extra hands.</li><li><b>Rule:</b> urgent issues same day; everything else batched. First 8 weeks of term run heavier.</li></ul><p style=\"margin-top:12px\"><b>Total: about 20 hours a week of invisible work. None of it does itself.</b></p><table><tr><th>Work</th><th>Hrs/week</th><th>Owner</th></tr><tr><td>Daily comms</td><td>~4</td><td>______</td></tr><tr><td>Leads</td><td>~3</td><td>______</td></tr><tr><td>Ledgers</td><td>4</td><td>______</td></tr><tr><td>Videos</td><td>~3</td><td>______</td></tr><tr><td>Saturdays</td><td>~8</td><td>______</td></tr></table><p style=\"font-size:13px;color:#8A6D2B\">Coverage to assign. Names go here.</p>"},
{tag:"SUPPORT NEEDED",en:"The sales lead starts when these seven arrive. They set direction and run sales independently; the studio provides the seven items below.<ul class=\"pts\"><li>Decision lines. <b>Answers back within 24 hours.</b></li><li>Lists, contacts, official account, cloud access. Day one.</li><li>Budgets approved first. Spending stays within approval.</li><li>One shared lead sheet, updated daily (owner on the sheet).</li><li>Separate sales contact. The founder’s personal stays personal.</li><li>Public email for high-rank parents.</li><li>Service windows (9:00\u201320:00) posted: account menu, front-desk sign, WeChat signature.</li></ul>"},
{tag:"CONSULTATION CORNER",en:"Build it. It is the mouth of the funnel.<ul class=\"pts\"><li>Consultations happen sitting down, in a quiet corner apart from the waiting lounge.</li></ul>"},
{tag:"ROOMS & PATHS",en:"Seven areas. Three routes. Set in stone.<ul class=\"pts\"><li>Teaching. Gallery. Front desk. Consultation corner. Waiting lounge. Storage. Photo corner.</li><li>Parents: enter, reception, gallery, talk, pay.</li><li>Kids: enter, class, pick-up. Filming: 5 minutes before class.</li></ul>"},
{tag:"SUPPLIES FOR SALE",en:"Parents ask. We show nothing. We sell nothing. That revenue goes elsewhere.<ul class=\"pts\"><li>Put supplies on the shelf.</li><li>Start with the 3 most-asked items.</li><li>Offer framing at extra charge.</li></ul>"},
{tag:"PRICING",en:"Prices are strict. Private by default.<ul class=\"pts\"><li><b>400/hr</b>, tailor-made. Current ~300 is history.</li><li><b>3+1 semester</b>: three months paid, one month free.</li><li><b>Tryout fee vs free: lock it (brief silent, meeting split).</b></li><li><b>Discounts enclosed only</b>: Josh-style 10%, early bird, royalty. Shared privately with the family concerned. They reward timing and loyalty.</li></ul>"},{tag:"EXHIBITIONS",en:"Shows sell the studio. Retention follows.<ul class=\"pts\"><li><b>Yearly group show</b>, May/June, in our own gallery now.</li><li><b>Solo show</b> after one year with us.</li><li><b>International comps</b>: 8-hour package, same price as a program. Extra revenue.</li><li><b>Next: January.</b> Beijing share agreed in writing first.</li><li>Museum visits in holidays — 20 kids when timed right.</li><li>Every entry returns with something: award or certificate.</li><li>Every chapter ends framed — mini-showcases feed the big show.</li></ul>"},{tag:"NOTEBOOK",en:"The gift that stays on desks.<ul class=\"pts\"><li><b>A6</b>, vintage-library hardcover (see reference).</li><li>First pages: studio intro + official-account QR.</li><li>Next pages: real art knowledge — cyanotype, Morandi, and more.</li><li>Rest: blank. Their notes, our logo on every desk.</li></ul><img src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBUODAsLDBkSEw8VHhsgHx4bHR0hJTApISMtJB0dKjkqLTEzNjY2ICg7Pzo0PjA1NjP/2wBDAQkJCQwLDBgODhgzIh0iMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzP/wAARCANwA3ADASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRC ? Tell me a better slot and I'll move things around. [Child] was just finding their stride; stopping now would be a pity.","两周没见到[孩子]了，现在的时间还方便吗？告诉我更合适的时间，我来调整。孩子刚找到感觉，这时候停下来挺可惜的。",""],["C1","CCA to studio","You're warmly invited: our end-of-term mini exhibition opens Saturday afternoon, and [child] has work in it. Come hear them talk it through for five minutes — grandparents very welcome too. Afterwards, come upstairs and see the studio.","诚挚邀请：结课小展周六下午开幕，[孩子]有作品参展。欢迎来听孩子讲五分钟，祖父母也一起来。展后欢迎上楼参观工作室。",""],["G1","Referral ask","If friends ever ask about art classes, feel free to pass along our referral card. Every referring family gets a thank-you, arranged privately. Most of our families found us this way.","如果朋友问起艺术课，欢迎把我们的引荐卡转给他们。每位转介绍的家庭都有心意，私下安排。我们大部分家庭都是这样来的。",""],["V1","Photo consent","We'd love to include [child]'s best moments in this week's short film, posted only on our official account. Close-ups always need your OK first — the consent form is attached, and a 'no' on any line is fully respected.","想把[孩子]本周的精彩瞬间放进本周短片，只发官方账号。特写镜头一定先征得您的同意，授权书附后，任何一条写“不同意”，我们都照办。",""],["S1","Showcase invite","You're invited to our art get-together this Saturday afternoon. Each child presents their work for about five minutes — grandparents warmly welcome. Hope to see you there.","邀请您参加本周六下午的艺术小聚。每个孩子上台讲五分钟自己的作品，欢迎祖父母一起来。期待见到您。",""],["B1","Which account","For the fastest reply, please message us here on the official account — the teacher is in class all day and rarely checks messages. We reply within one hour.","要最快回复，请直接在这个官方号留言，老师白天都在上课，很少看消息。我们保证一小时内回复。",""],["F1","Fee + private thank-you","Thank you for bringing [names] along — it means a lot to us. We've added a private thank-you discount to your summary (attached): [n] sessions, CNY [amount]. This rate stays between us, not a public offer. Settling by [date] lets all the kids finish within the semester.","感谢您带来[名字]，这对我们意义很大。附件是您的费用小结，已附上私下感谢折扣：共[n]节，合计[金额]元。这个价格只给您，不对外。请在[日期]前确认，这样几个孩子都能在本学期内上完。",""],["K1","Camp invite (soft)","Are you staying in Shanghai for the holidays? We're running a [theme] camp week — full days, one theme, finished work to take home every day. Several regulars are coming; I can hold a spot, or pass this to a friend who is staying too.","假期留沪吗？我们有一周[主题]营，全日制、一个主题、每天都有成品带回家。几个老学员已经报名了，需要留位告诉我，也可以转给同样留沪的朋友。",""],["E1","Exhibition pack","There's a [name] exhibition in [month] and we'd like to enter [child]'s work. Preparation is an 8-hour pack at the regular program rate — materials and entry covered. Shall I reserve the hours?","[月份]有个[名称]展览，想送[孩子]的作品去。备展是8小时包，和常规课程同价，材料和送展都含在内。需要我把时间留出来吗？",""],["U1","Second nudge (firm)","Hello [name], following up on the [date] summary (CNY [amount]) — still open. If timing is the issue, give me a date and I'll note it. Otherwise please settle this week so [child]'s classes run uninterrupted.","您好[称呼]，[日期]的费用单（[金额]元）还没结。如果是付款时间的问题，告诉我一个日期，我记下来。不然的话，麻烦本周结一下，孩子上课不受影响。",""]],"Approvals":[["Date","Type","Student/Item","Amount/Discount","Requested by","Approved by","Status","","","","",""],["Approvals","","","","","","","←","","","",""],["2026-10-20","Discount (early bird/loyal)","Josh 4 kids","10% off","","","Requested","","","","",""],["","Exhibition cut","Beijing organizer %","TBD — get it in writing before any entry work starts","","","Requested","","","","",""],["","Partnership","EKA points linkage + 2h staff taster","Pending EKA reply (spend/park link; taster format TBD)","","","Requested","","","","",""]],"Gantt":[["Task","Start","End","Progress","2026-10","2026-11","2026-12","2027-01","2027-02","2027-03","2027-04","2027-05"],["Timeline · 0 OVERDUE · 0 DONE","","","","","","","","","","",""],["Stock closing gifts (sketchbook + stickers + pen + QR + red packet)","2026-11","2026-11","0","","X","","","","","",""],["Window + lift ads live in 3 days","2026-10","2026-10","0","X","","","","","","",""],["Buy real pumpkins early + count tables","2026-10","2026-10","0","X","","","","","","",""],["Collect reviews + referrals","2026-11 document.getElementById('pgInd').textContent=(cur+1)+' / '+PAGES.length;var _fl=document.getElementById('folio');if(_fl){var _pl=P.type==='cover'?'Cover':(P.type==='toc'?'Contents':(P.type==='sheet'?'Checklist':P.tag));_fl.style.display=((P.type==='cover'||P.type==='front'||P.type==='back')?'none':'');_fl.textContent='— '+_pl+' · '+rn(cur+1)+' / '+rn(PAGES.length)+' —';}
document.getElementById('prevBtn').disabled=(cur===0);
var _nx=PAGES[cur+1];var _nl=_nx?(_nx.tag?('Next: '+_nx.tag.split(' ')[0]):(_nx.type==='sheet'?'Next: Checklist':'Next \u2192')):'Done';
document.getElementById('nextBtn').textContent=cur>=PAGES.length-1?'Back to start':_nl;
upd();
try{mountWB();}catch(e){}

}
function save(){try{localStorage.setItem('novartBook',JSON.stringify(st));}catch(e){}}
function tog(i){st['r'+i]=!st['r'+i];save();render();}
function go(i){cur=Math.max(0,Math.min(PAGES.length-1,i));save();render();window.scrollTo(0,0);}
function upd(){let n=0,d=0;PAGES.forEach((p,i)=>{if(p.tag||p.type==='sheet'){d++;if(st['r'+i])n++;}});ROWS.forEach((_,i)=>{d++;if(st['c'+i])n++;});
document.getElementById('pct').textContent=n+' / '+d+' · '+Math.round(n/d*100)+'%';document.getElementById('bar').style.width=(d?Math.round(n/d*100):0)+'%';
var _pc=d?Math.round(n/d*100):0;var _mg=_pc>=100?'All locked: take the photo!':(_pc>=50?'Over halfway: keep going':(n>0?'Nice: keep going':'Let us begin'));var _pe=document.querySelector('.progress .t span:first-child');if(_pe)_pe.textContent='✔ '+n+'/'+d+' · '+_mg;}
document.getElementById('prevBtn').onclick=()=>go(0);
document.getElementById('nextBtn').onclick=()=>{if(cur>=PAGES.length-1)go(0);else go(cur+1);};
document.getElementById('tocBtn').onclick=()=>go(2);
document.getElementById('musBtn').onclick=()=>togMus();
function initAudio(){var a=document.getElementById('bgm');if(!a)return;try{a.volume=0.10;a.play();}catch(e){}}
function togMus(){var a=document.getElementById('bgm');if(!a)return;var b=document.getElementById('musBtn');try{if(a.paused){a.play();b.style.opacity=1;}else{a.pause();b.style.opacity=0.35;}}catch(e){}}
render();
</script>
